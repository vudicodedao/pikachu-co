<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="headClip">
      <circle cx="43" cy="22" r="17" />
    </clipPath>
    <linearGradient id="bodyGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>
  
  <!-- Đuôi chim -->
  <polygon points="12,28 2,21 5,31 2,41 12,35" fill="#d97706" stroke="#92400e" stroke-width="2" />
  
  <!-- Thân chim vàng mập -->
  <ellipse cx="27" cy="34" rx="19" ry="14" fill="url(#bodyGrad)" stroke="#b45309" stroke-width="2.5" />
  
  <!-- Bụng chim -->
  <ellipse cx="27" cy="38" rx="12" ry="8" fill="#fef9c3" />
  
  <!-- Cánh chim -->
  <ellipse cx="21" cy="33" rx="10" ry="6" transform="rotate(-15 21 33)" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
  
  <!-- ĐẦU CHIM: Khuôn mặt phồng má thổi bong bóng -->
  <image href="data:image/jpeg;base64," x="25" y="4" width="36" height="36" clip-path="url(#headClip)" />
  
  <!-- Viền bảo vệ màu hổ phách quanh khuôn mặt -->
  <circle cx="43" cy="22" r="17" fill="none" stroke="#f59e0b" stroke-width="2.5" />
</svg>